name: Three-hour market watch

on:
  schedule:
    # GitHub Actions schedules use UTC. Running at :17 avoids the busiest top-of-hour window.
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect-and-price:
    runs-on: ubuntu-latest
    steps:
      - name: Collect marketplace data
        run: |
          curl --fail --silent --show-error \
            --retry 3 --retry-delay 5 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://arcarddass.vercel.app/api/cron/collect-market-data"

      - name: Publish the hourly price update
        run: |
          curl --fail --silent --show-error \
            --retry 3 --retry-delay 5 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://arcarddass.vercel.app/api/cron/update-market-prices"
