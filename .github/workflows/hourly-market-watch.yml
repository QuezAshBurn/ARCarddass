name: Three-hour market watch

on:
  schedule:
    # GitHub Actions schedules use UTC. Running at :17 avoids the busiest top-of-hour window.
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect-and-price:
    runs-on: ubuntu-latest
    steps:
      - name: Verify scheduler secret
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::GitHub Actions secret CRON_SECRET is missing. Add the same value used by Vercel."
            exit 1
          fi

      - name: Collect marketplace data
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          response_file="$(mktemp)"
          status_code=$(curl --silent --show-error --output "$response_file" --write-out "%{http_code}" \
            --retry 3 --retry-delay 5 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://arcarddass.vercel.app/api/cron/collect-market-data")
          cat "$response_file"
          test "$status_code" -ge 200 -a "$status_code" -lt 300 || {
            echo "::error::Collection endpoint returned HTTP $status_code. 401 means the GitHub and Vercel CRON_SECRET values differ; 500 means inspect Vercel runtime logs."
            exit 1
          }

      - name: Publish the three-hour price update
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          response_file="$(mktemp)"
          status_code=$(curl --silent --show-error --output "$response_file" --write-out "%{http_code}" \
            --retry 3 --retry-delay 5 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://arcarddass.vercel.app/api/cron/update-market-prices")
          cat "$response_file"
          test "$status_code" -ge 200 -a "$status_code" -lt 300 || {
            echo "::error::Price update endpoint returned HTTP $status_code. 401 means the GitHub and Vercel CRON_SECRET values differ; 500 means inspect Vercel runtime logs."
            exit 1
          }
